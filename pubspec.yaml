name: step_quest
description: "StepQuest — turn real-world steps into currency (Phase 0 prototype)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # --- Health / steps (doc §2.1, §3.5) ---
  health: ^13.3.1              # HealthKit (iOS) + Health Connect (Android)
  pedometer: ^4.0.0            # live streamed step count for the in-app counter
  permission_handler: ^11.3.1  # runtime perms (activity recognition, etc.)

  # --- State management (doc §3.2) ---
  flutter_riverpod: ^2.5.1

  # --- Backend (Phase 1) ---
  # Inert unless SUPABASE_URL / SUPABASE_ANON_KEY are passed via --dart-define;
  # the app stays fully playable offline/local-only without them.
  supabase_flutter: ^2.5.6

  # --- Local persistence & utils ---
  shared_preferences: ^2.2.3   # local save + offline cache in front of Supabase
  intl: ^0.19.0
  in_app_purchase: ^3.3.0
  google_mobile_ads: ^9.0.0

  # --- Add in later phases (each needs extra native/config setup) ---
  # flame: ^1.18.0             # 2D game layer            (Phase 2+)
  # rive: ^0.13.0              # vector animation         (Phase 2+)
  # firebase_core: ^3.0.0      # backend / server-auth    (Phase 1) — needs firebase config files
  # firebase_auth: ^5.0.0
  # cloud_firestore: ^5.0.0
  # firebase_messaging: ^15.0.0
  # workmanager: ^0.5.2        # background step sync     (Phase 2+)
  # geolocator: ^12.0.0        # TURBO GPS session        (Phase 4, doc §2.4)
  # flutter_foreground_task: ^6.0.0  # TURBO foreground service (Phase 4)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # 64x64 pixel-art sprites. Drop PNGs named by item id into these folders to
  # replace the emoji placeholders (see docs/ASSETS.md).
  assets:
    - assets/character/base/
    - assets/character/face/
    - assets/character/hair/
    - assets/character/tops/
    - assets/character/bottoms/
    - assets/character/shoes/
    - assets/character/hats/
    - assets/character/accessories/
    - assets/pets/
    - assets/home/
    - assets/ui/
